

theme = "catppuccin_mocha"

[editor]
auto-completion=true
# auto-save=true
auto-format=false
bufferline="multiple"
trim-trailing-whitespace = true
end-of-line-diagnostics = "hint"

rulers = [81, 101]

# Used for soft-wrap and :reflow
text-width = 84


# [editor.soft-wrap]
# enable = true
# wrap-at-text-width = true

[editor.inline-diagnostics]
# cursor-line = "warning" # show warnings and errors on the cursorline inline
# other-lines = "error"

[editor.indent-guides]
render = true
skip-levels = 0

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 300000

[editor.file-picker]
hidden = false # Show dot files

[editor.lsp]
display-messages = true
# display-inlay-hints = true
auto-signature-help = true
display-progress-messages = true

snippets = true

# https://helix-editor.vercel.app/help/recipes#more-intuitive-x-and-x-motions
[keys.select]
# "S-x" = ["extend_line_up", "extend_to_line_bounds"]
x = "select_line_below"
X = "select_line_above"

# From https://github.com/helix-editor/helix/wiki/Recipes#project-wide-search-and-replace-with-scooter
[keys.select.ret]
s = [
    ":write-all",
    ":insert-output scooter --no-stdin >/dev/tty",
    ":redraw",
    ":reload-all"
]

# Channel my inner vim

[keys.normal]
# g = { a = "code_action" } # Maps `ga` to show possible code actions
"'" = {w = ":toggle soft-wrap.enable"}
g = {q = ":reflow"}

# Enable shrinking a selection with Shift+X, the inverse of just x.
x = "select_line_below"
X = "select_line_above"


[keys.normal." "]

o = ":sh hx-gh-link.sh \"%{current_working_directory}\" \"%{buffer_name}\" \"%{cursor_line}\" \"%{selection_line_start}\" \"%{selection_line_end}\" open"
O = ":sh hx-gh-link.sh \"%{current_working_directory}\" \"%{buffer_name}\" \"%{cursor_line}\" \"%{selection_line_start}\" \"%{selection_line_end}\" osc52"

# Launch Yazi
e = [
  ':sh rm -f /tmp/unique-file-h21a434',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file-h21a434',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file-h21a434}',
  ':redraw',
]
