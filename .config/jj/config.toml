#:schema https://jj-vcs.github.io/jj/prerelease/config-schema.json
## ------------------------------------------------------------------------------------------------
#
# Lots of useful: https://gist.github.com/thoughtpolice/8f2fd36ae17cd11b8e7bd93a70e31ad6#file-jjconfig-toml
#:tombi schema.strict = false

[user]
email = "damien@omad.net"
name = "Damien Ayers"

[revsets]
# present(x): The current comment (or none if it doesn't exist). But I don't know how it could ever not exist...
# ancestors
log = "present(@) | ancestors(immutable_heads().., 4) | trunk()"

[ui]
color = "auto"
# diff-editor = "diffedit3"
# merge-editor = "kdiff3"
diff-editor = ":builtin"

# diff-formatter = ["difft", "--color=always", "$left", "$right"]

# [merge-tools.diffnav]
# diff-args = ["difft", "--color=always", "$left", "$right"]

[merge-tools.difft]
diff-args = ["difft", "--color=always", "$left", "$right"]

[git]
colocate = true

[templates]
git_push_bookmark = "\"dra/push-\" ++ change_id.short()"

[template-aliases]
'format_field(key, value)' = 'key ++ ": " ++ value ++ " "'

[aliases]
# Find the closest ancestor with a bookmark pointing at it, and move it to the
# parent of the working copy.
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]

# Run pre-commit check before pushing to remote git repos
# https://github.com/acarapetis/jj-pre-push
push = ["util", "exec", "--", "uvx", "jj-pre-push", "push"]

[[--scope]]
--when.repositories = ["~/dev/easi/", "~/dev/csiro/", "~/dev/easi-gh/"]

[--scope.user]
email = "damien.ayers@csiro.au"

[gg.ui]
recent-workspaces = ["/Users/aye011/dev/odc/datacube-explorer", "/Users/aye011/dev/psysonic", "/Users/aye011/dev/prometheus-community-helm-charts", "/Users/aye011/dev/easi-gh/csa-easi-tf-modules", "/Users/aye011/dev/easi-gh/csa-easi-aws-sub-apse2", "/Users/aye011/dev/easi-gh/csa-easi-flux-dev-admin", "/Users/aye011/dev/easi-gh/csa-easi-flux-platform-admin", "/Users/aye011/dev/easi/flux-v2-easi-platform-admin", "/Users/aye011/dev/damien-neets-finances/lazy-beancount", "/Users/aye011/dev/odc/datacube-core-pgstac-index"]

